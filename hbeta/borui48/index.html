  <script>
    const sourceSelect = document.getElementById('sourceSelect');
    const sourceSearch = document.getElementById('sourceSearch');
    const matchCount = document.getElementById('matchCount');
    const allSources = Array.from(sourceSelect.options).map(option => ({
      value: option.value,
      text: option.textContent
    }));

    function openSelected() {
      if (sourceSelect.value) {
        document.getElementById('viewer').src = sourceSelect.value;
      }
    }

    function filterSources() {
      const query = sourceSearch.value.trim().toLowerCase();
      const matches = allSources.filter(source =>
        source.text.toLowerCase().includes(query)
      );

      sourceSelect.replaceChildren();
      for (const source of matches) {
        const option = document.createElement('option');
        option.value = source.value;
        option.textContent = source.text;
        sourceSelect.appendChild(option);
      }

      matchCount.textContent = matches.length + (matches.length === 1 ? ' match' : ' matches');
    }

    sourceSearch.addEventListener('input', filterSources);
    sourceSearch.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        openSelected();
      }
    });
    sourceSelect.addEventListener('change', openSelected);
  </script>
