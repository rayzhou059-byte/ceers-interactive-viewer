<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UDS-57040 - Hbeta viewer</title>
  <style>
    :root { --blue:#173f5f; --pale:#f4f7fa; --border:#d9e1e8; }
    * { box-sizing:border-box; }
    body { margin:0; padding:22px; color:#17202a; background:var(--pale); font:14px Arial,sans-serif; }
    header { max-width:1400px; margin:0 auto 16px; }
    h1 { margin:0 0 6px; font-size:24px; }
    .sub { color:#607080; }
    .spectrum-card { max-width:1400px; margin:0 auto 18px; padding:16px; background:white; border:1px solid var(--border); border-radius:10px; box-shadow:0 2px 8px #20304012; }
    .spectrum-heading { display:flex; justify-content:space-between; gap:15px; flex-wrap:wrap; }
    .number { display:inline-block; min-width:27px; padding:5px; margin-right:8px; color:white; background:var(--blue); border-radius:50%; text-align:center; }
    .meta { color:#607080; }
    .badge-row { display:flex; gap:10px; margin:12px 0; flex-wrap:wrap; }
    .line-badge { display:flex; gap:12px; padding:9px 12px; border-radius:7px; }
    .badge-good { background:#e9f7ef; border:1px solid #8bd3aa; }
    .badge-none { background:#f4f4f4; border:1px solid #ccc; color:#666; }
    .annotation-box { display:flex; gap:9px; align-items:center; flex-wrap:wrap; padding:10px 12px; background:#fff7df; border:1px solid #efd27e; border-radius:7px; }
    select,input,button { padding:7px 9px; border:1px solid #aeb8c2; border-radius:5px; }
    input { min-width:220px; flex:1; }
    button { color:white; background:var(--blue); cursor:pointer; }
    .save-status { color:#557; min-width:120px; }
    .plot-wrap { margin-top:9px; }
    .missing { margin:16px 0; padding:30px; background:#ffecec; color:#922; }
  </style>
</head>
<body>
  <header><h1>UDS-57040</h1><div class="sub">0 spectra sorted by OIII/Halpha SNR; classify Hbeta separately for every spectrum.</div></header>
  
</body>
</html>
